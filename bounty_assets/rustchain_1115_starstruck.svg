<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RustChain 128 GitHub Stars — Starstruck Bronze</title>
  <desc id="desc">Original Elyan Labs and RustChain celebration graphic for the 128 GitHub stars milestone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1c2d"/>
      <stop offset="1" stop-color="#14100d"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
