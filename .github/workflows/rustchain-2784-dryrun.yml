name: RustChain miner dry-run bounty 2784

on:
  push:
    paths:
      - '.github/workflows/rustchain-2784-dryrun.yml'

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record runner environment
        run: |
          echo '=== RUNNER ENVIRONMENT ==='
          uname -a
          cat /etc/os-release
          echo '--- CPU ---'
          lscpu
          echo '--- virtualization ---'
          systemd-detect-virt || true

      - name: Check out RustChain main
        uses: actions/checkout@v4
        with:
          repository: Scottcjn/Rustchain
          path: rustchain
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install miner runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pynacl

      - name: Run the actual miner in dry-run mode
        working-directory: rustchain/miners/linux
        run: |
          set -o pipefail
          echo '=== RUSTCHAIN MINER DRY RUN ==='
          python rustchain_linux_miner.py --dry-run --show-payload --verbose 2>&1 | tee "$GITHUB_WORKSPACE/rustchain_2784_dryrun.txt"
          echo '=== END DRY RUN ==='

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: rustchain-2784-dryrun
          path: rustchain_2784_dryrun.txt
          if-no-files-found: error
