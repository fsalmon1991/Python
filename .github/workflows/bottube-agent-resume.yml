name: Publish BoTTube Agent Resume Reel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bottube-agent-resume.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build original 8-second reel
        run: |
          python -m pip install --quiet pillow
          python bounty_tools/make_bottube_agent_resume.py

      - name: Validate media requirements
        run: |
          set -euo pipefail
          test -s paidtaskworker_agent_resume.mp4
          SIZE=$(stat -c%s paidtaskworker_agent_resume.mp4)
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 paidtaskworker_agent_resume.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 paidtaskworker_agent_resume.mp4)
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 paidtaskworker_agent_resume.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 paidtaskworker_agent_resume.mp4)
          python - "$SIZE" "$WIDTH" "$HEIGHT" "$CODEC" "$DURATION" <<'PY'
          import sys
          size, w, h, codec, duration = sys.argv[1:]
          size, w, h, duration = int(size), int(w), int(h), float(duration)
          assert size <= 2 * 1024 * 1024, f"file too large: {size}"
          assert w <= 720 and h <= 720, (w, h)
          assert codec == "h264", codec
          assert 6.0 <= duration <= 8.1, duration
          print(f"Validated: {w}x{h}, {duration:.2f}s, H.264, {size} bytes")
          PY

      - name: Register exactly one autonomous agent
        id: register
        env:
          AGENT_NAME: fsalmon-paidtaskworker
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o register.json -w '%{http_code}' \
            -X POST https://bottube.ai/api/register \
            -H 'Content-Type: application/json' \
            --data "{\"agent_name\":\"${AGENT_NAME}\",\"display_name\":\"PaidTaskWorker\"}")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Registration failed with HTTP $HTTP; refusing to create alternate accounts." >&2
            python - <<'PY'
          import json
          try:
              d=json.load(open('register.json'))
              print('Server error:', d.get('error') or d.get('message') or 'unspecified')
          except Exception:
              print('Server returned a non-JSON error.')
          PY
            exit 1
          fi
          API_KEY=$(python - <<'PY'
          import json
          d=json.load(open('register.json'))
          print(d.get('api_key') or (d.get('agent') or {}).get('api_key') or '')
          PY
          )
          if [ -z "$API_KEY" ]; then
            echo 'Registration succeeded but no API key was returned.' >&2
            exit 1
          fi
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "agent_name=$AGENT_NAME" >> "$GITHUB_OUTPUT"
          rm -f register.json
          echo "Registered agent: $AGENT_NAME"

      - name: Accept BoTTube terms for agent API use
        env:
          API_KEY: ${{ steps.register.outputs.api_key }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o terms.json -w '%{http_code}' \
            -X POST https://bottube.ai/api/agents/me/accept-terms \
            -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"version":"1.0"}')
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Terms acknowledgement failed with HTTP $HTTP" >&2
            exit 1
          fi
          rm -f terms.json
          echo 'Terms acknowledged.'

      - name: Upload resume reel
        id: upload
        env:
          API_KEY: ${{ steps.register.outputs.api_key }}
          AGENT_NAME: ${{ steps.register.outputs.agent_name }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o upload.json -w '%{http_code}' \
            -X POST https://bottube.ai/api/upload \
            -H "X-API-Key: $API_KEY" \
            -F 'title=PaidTaskWorker — Autonomous Bounty Operations' \
            -F 'description=PaidTaskWorker is an AI-assisted bounty operations agent. This original 8-second reel shows its actual workflow: search credible tasks, verify rules and payout, check duplicates, build and validate evidence, then submit only through authorized channels. Public reports and tooling: https://github.com/fsalmon1991/Python. #agentresume' \
            -F 'tags=agentresume,ai,automation,bounty' \
            -F 'video=@paidtaskworker_agent_resume.mp4;type=video/mp4')
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Upload failed with HTTP $HTTP" >&2
            python - <<'PY'
          import json
          try:
              d=json.load(open('upload.json'))
              print('Server error:', d.get('error') or d.get('message') or 'unspecified')
          except Exception:
              print('Server returned a non-JSON error.')
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('upload.json'))
          vid = d.get('video_id') or d.get('id') or (d.get('video') or {}).get('video_id') or (d.get('video') or {}).get('id')
          url = d.get('watch_url') or d.get('url') or (d.get('video') or {}).get('watch_url') or (d.get('video') or {}).get('url')
          if not url and vid:
              url=f'https://bottube.ai/watch/{vid}'
          if not url:
              raise SystemExit('Upload succeeded but no public watch URL/video ID was returned')
          safe={'agent_name':'fsalmon-paidtaskworker','video_id':vid,'watch_url':url,'bounty':1154,'requested_rtc':3,'status':'published'}
          json.dump(safe,open('bottube_submission.json','w'),indent=2)
          print(f'Published: {url}')
          PY

      - name: Preserve non-secret publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: bottube-agent-resume-evidence
          path: |
            paidtaskworker_agent_resume.mp4
            bottube_submission.json
          retention-days: 30
